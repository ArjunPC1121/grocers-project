spring.application.name=EmployeeApp
server.port=8082

spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:free
spring.datasource.username=system
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# RequestApp is an internal dependency used by the employee request endpoints.
services.requestapp-url=http://localhost:8086/grocers/api/requests
services.orderapp-url=http://localhost:8085/grocers/api/orders

app.gateway.internal-secret=${GATEWAY_INTERNAL_SECRET:replace-this-shared-secret-in-production}
