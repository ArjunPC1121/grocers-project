spring.application.name=productsapp

server.port=8083

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:free
spring.datasource.username=system
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# The Oracle Text index already exists. Do not rerun schema.sql on each
# application startup when ddl-auto=update preserves the database schema.
spring.sql.init.mode=never

# Generate embeddings locally in Spring Boot.
spring.ai.model.embedding=transformers

# Both the tokenizer and model belong to the same model.
spring.ai.embedding.transformer.tokenizer.uri=https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/raw/main/tokenizer.json
spring.ai.embedding.transformer.onnx.model-uri=https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx

spring.ai.embedding.transformer.onnx.model-output-name=last_hidden_state
spring.ai.embedding.transformer.tokenizer.options.padding=true
spring.ai.embedding.transformer.cache.enabled=true
spring.ai.embedding.transformer.cache.directory=${user.home}/.cache/productsapp/onnx

product.search.embedding-dimensions=384
product.search.embedding-model=all-MiniLM-L6-v2
product.search.text-candidate-limit=150
product.search.max-results=50
product.search.minimum-semantic-score=0.15
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.config.import=optional:file:../.env[.properties]