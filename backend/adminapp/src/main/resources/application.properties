spring.application.name=adminapp

server.port=8081

spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:free
spring.datasource.username=system
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Temporary cross-service contracts. Replace only these URLs when teammates publish final endpoints.
services.products-url=http://localhost:8083/api/products
services.employees-url=http://localhost:8082/grocers/api/employees
services.users-url=http://localhost:8080/grocers/api/users
services.requests-url=http://localhost:8086/grocers/api/requests
services.orders-url=http://localhost:8085/grocers/api/orders
services.carts-url=http://localhost:8084/grocers/api/carts
services.cart-product-cleanup-enabled=false
