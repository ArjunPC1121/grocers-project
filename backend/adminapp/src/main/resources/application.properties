# Maintainer configuration note: settings for adminapp. See backend/adminapp/README.md before changing ports, security secrets, routes, schema settings, or integration endpoints.
spring.application.name=adminapp

server.port=8081

spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:free
spring.datasource.username=system
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Temporary cross-service contracts. Replace only these URLs when teammates publish final endpoints.
services.products-url=http://localhost:8083/grocers/api/products
services.employees-url=http://localhost:8082/grocers/api/employees
services.users-url=http://localhost:8080/grocers/api/users
services.requests-url=http://localhost:8086/grocers/api/requests
services.orders-url=http://localhost:8085/grocers/api/orders
services.carts-url=http://localhost:8084/grocers/api/carts
services.cart-product-cleanup-enabled=true
services.gateway-internal-secret=${GATEWAY_INTERNAL_SECRET:replace-this-shared-secret-in-production}
spring.servlet.multipart.max-file-size=5MB

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=admin-notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.product-request-topic=product-request-created