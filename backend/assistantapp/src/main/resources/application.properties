spring.application.name=assistantapp
server.port=8092

# Keep the real API key outside Git. Set GEMINI_API_KEY in the terminal that starts this app.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
services.products-url=${PRODUCTS_SERVICE_URL:http://localhost:8083/grocers/api/products}
app.gateway.internal-secret=${GATEWAY_INTERNAL_SECRET:replace-this-shared-secret-in-production}
