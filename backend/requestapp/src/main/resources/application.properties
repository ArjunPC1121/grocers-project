# Maintainer configuration note: settings for requestapp. See backend/requestapp/README.md before changing ports, security secrets, routes, schema settings, or integration endpoints.
server.port=8086
spring.application.name=requestapp
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:free
spring.datasource.driverClassName=oracle.jdbc.driver.OracleDriver
spring.datasource.username=system
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

services.products-url=http://localhost:8083/grocers/api/products
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.kafka.product-request-topic=product-request-created

