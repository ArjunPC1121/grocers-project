spring.application.name=supportassistantapp
server.port=8093

# Support Assistant is independent from the recipe-planning Assistant App.
support.ai.api-key=${GEMINI_API_KEY:}
support.ai.model=${SUPPORT_GEMINI_MODEL:${GEMINI_MODEL:gemini-3.5-flash-lite}}
app.gateway.internal-secret=${GATEWAY_INTERNAL_SECRET:replace-this-shared-secret-in-production}

services.products-url=${PRODUCTS_SERVICE_URL:http://localhost:8083/grocers/api/products}
services.users-url=${USERS_SERVICE_URL:http://localhost:8080/grocers/api/users}
services.carts-url=${CARTS_SERVICE_URL:http://localhost:8084/grocers/api/carts}
services.orders-url=${ORDERS_SERVICE_URL:http://localhost:8085/grocers/api/orders}
services.requests-url=${REQUESTS_SERVICE_URL:http://localhost:8086/grocers/api/requests}
services.employees-url=${EMPLOYEES_SERVICE_URL:http://localhost:8082/grocers/api/employees}
services.admin-url=${ADMIN_SERVICE_URL:http://localhost:8081/grocers/api/admin}
