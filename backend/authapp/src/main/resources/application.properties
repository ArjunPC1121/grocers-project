spring.application.name=authapp
server.port=8090

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:free
spring.datasource.username=system
spring.datasource.password=root

# AuthApp reads existing account tables only; it never creates or changes tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Set JWT_SECRET to a random value of at least 32 characters before starting AuthApp.
app.jwt.secret=arjun_akash_abhiram_pragathi_pranav
app.jwt.user-expiration-ms=86400000
app.jwt.employee-expiration-ms=43200000
app.jwt.admin-expiration-ms=28800000
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
