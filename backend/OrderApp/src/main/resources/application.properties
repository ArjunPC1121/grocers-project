spring.application.name=OrderApp
server.port=8085

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521:free}
spring.datasource.username=${DB_USERNAME:system}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

grocers.services.user.base-url=${USER_SERVICE_URL:http://localhost:8080}
grocers.services.employee.base-url=${EMPLOYEE_SERVICE_URL:http://localhost:8082}
grocers.services.products.base-url=${PRODUCTS_SERVICE_URL:http://localhost:8083}
grocers.services.cart.base-url=${CART_SERVICE_URL:http://localhost:8084}
grocers.http.connect-timeout=${GROCERS_CONNECT_TIMEOUT:2s}
grocers.http.read-timeout=${GROCERS_READ_TIMEOUT:5s}
