spring.application.name=OrderApp
server.port=8085

spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:free
spring.datasource.username=system
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

grocers.services.user.base-url=${USER_SERVICE_URL:http://localhost:8080}
grocers.services.employee.base-url=${EMPLOYEE_SERVICE_URL:http://localhost:8082}
grocers.services.products.base-url=${PRODUCTS_SERVICE_URL:http://localhost:8083}
grocers.services.cart.base-url=${CART_SERVICE_URL:http://localhost:8084}
grocers.services.funds.base-url=${FUNDS_SERVICE_URL:http://localhost:8088}
grocers.http.connect-timeout=${GROCERS_CONNECT_TIMEOUT:2s}
grocers.http.read-timeout=${GROCERS_READ_TIMEOUT:5s}
