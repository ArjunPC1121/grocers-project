spring.application.name=OrderApp
server.port=8085

spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:free
spring.datasource.username=system
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
product.service.url=http://localhost:8083/grocers/api/products
user.service.url=http://localhost:8080/grocers/api/users
cart.service.url=http://localhost:8084/grocers/api/carts
employee.service.url=http://localhost:8082/grocers/api/employees
app.gateway.internal-secret=${GATEWAY_INTERNAL_SECRET:replace-this-shared-secret-in-production}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false